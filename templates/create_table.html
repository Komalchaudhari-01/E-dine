<!DOCTYPE html>
<html lang="en">

<head>

    <title>Create Table</title>
    <link rel='stylesheet' href="/static/style.css">
    <link rel='stylesheet' href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <div>
                    <div class='text-center'>

                        <h2>Create Table</h2>
                    </div>

                    <form>
                        <div class="form-group">
                            <label for="Input3">Table Number</label>
                            <input type="text" class="form-control" id="Input3">
                        </div>
                        <div class="form-group">
                            <label for="Input1">Capacity</label>
                            <input type="number" class="form-control" id="Input1">
                        </div>
                        <div class="form-group">
                            <label for="Input2">Location</label>
                            <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg example">
                                
                                <option value="1">Indoor</option>
                                <option value="2">Outdoor</option>
                                
                            </select>

                        </div>
                        <div>
                            <div class='text-center'>
                                <input type="button" class="btn btn-primary" value="Create Table"><br>

                            </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
