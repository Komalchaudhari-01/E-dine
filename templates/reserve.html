<!DOCTYPE html>
<html lang="en">

<head>

    <title>Reserve Table</title>
    <link rel='stylesheet' href="/static/style.css">
    <link rel='stylesheet' href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <div>
                    <div class='text-center'>

                        <h2>Reservation Request</h2>
                    </div>

                    <form>
                        <div class="form-group">
                            <label for="Input3">Table Number</label>
                            
                            <input class="form-control" type="text" value="T1" 
                            aria-label="Disabled input example" disabled readonly>
                        </div>
                        <div class="form-group">
                            <label for="Input1">Date</label>
                            <input type="date" class="form-control" id="Input1">
                        </div>
                        <div class="form-group">
                            <label for="Input2">Time Slot</label>
                            <input type="text" class="form-control" id="Input2" placeholder="e.g. 7:00 PM - 9:00 PM">
                        </div>
                        <div>
                            <div class='text-center'>
                                <input type="button" class="btn btn-primary" value="Reserve Table"><br>

                            </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
